# RTSP Server Configuration for PC Simulation
# This file is read at startup, no need to rebuild after changes

# Video: H.264, 1920x1080, 30fps
[video]
file = tests/assets/video/full_frame_camera.h264
fps = 30
codec = 0

# Audio: PCM S16LE (Little-Endian), 16KHz, mono
# Note: Input file is s16le, RTSP L16 will be converted to big-endian (network byte order)
[audio]
file = tests/assets/audio/full_frame_camera.pcm
sample_rate = 16000
channels = 1
samples_per_packet = 640
codec = 2

[playback]
loop = true
