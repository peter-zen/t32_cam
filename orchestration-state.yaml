- 'common_utils_crc (src/common/utils/crc/CMakeLists.txt) depends on cal_crc16 from
  the crc16 lib but does not link it; latent missing-dep masked because htc_main_app
  links crc16 directly. Follow-up: declare `target_link_libraries(common_utils_crc
  PUBLIC logger crc16)` at the source so consumers inherit it transitively instead
  of each consumer re-adding crc16 (as manifest now does).'
- 'media_rtsp (src/media/rtsp/CMakeLists.txt:36) uses DayNightSwitch (RtspServer.cpp:587-595,
  NOT BUILD_FOR_SIMULATION-gated) but does not link the daynight target. Latent missing-dep
  masked because htc_main_app links daynight directly; surfaces as a sim (and likely
  T32) link failure for htc_media_app (undefined DayNightSwitch::* refs). Same class
  as the crc16/T10 issue. Fix: target_link_libraries(media_rtsp PRIVATE ... daynight)
  at the source. Pre-existing, not introduced by T9-T12.'
